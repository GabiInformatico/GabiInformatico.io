<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Contraseña</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .contenedor {
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
        }

        h2 { color: #333; }

        /* Estilos para el selector y el input */
        select, input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        #mensaje {
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
            min-height: 20px;
        }

        .error { color: #dc3545; }
        .exito { color: #28a745; }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>Acceso Privado</h2>
        <p>Selecciona el tipo de prueba:</p>
        
        <select id="tipoPrueba">
            <option value="A">Prueba A</option>
            <option value="B">Prueba B</option>
        </select>

        <input type="password" id="inputPassword" placeholder="Introduce la contraseña...">
        
        <button onclick="validarPassword()">Entrar</button>
        
        <p id="mensaje"></p>
    </div>

    <script>
        function validarPassword() {
            // Definimos las dos contraseñas
            const passA = "Kat";
            const passB = "Gemini";

            // Obtenemos los valores de la interfaz
            const seleccion = document.getElementById("tipoPrueba").value;
            const inputUsuario = document.getElementById("inputPassword").value;
            const cajaMensaje = document.getElementById("mensaje");

            let esCorrecto = false;

            // Lógica de validación según la selección
            if (seleccion === "A") {
                if (inputUsuario === passA) esCorrecto = true;
            } else if (seleccion === "B") {
                if (inputUsuario === passB) esCorrecto = true;
            }

            // Respuesta visual
            if (esCorrecto) {
                cajaMensaje.textContent = "✅ Correcto. Acceso concedido a Prueba " + seleccion;
                cajaMensaje.className = "exito";
            } else {
                cajaMensaje.textContent = "❌ Contraseña de Prueba " + seleccion + " incorrecta.";
                cajaMensaje.className = "error";
                
                // Limpiar y enfocar
                document.getElementById("inputPassword").value = "";
                document.getElementById("inputPassword").focus();
            }
        }
    </script>

</body>
</html>
