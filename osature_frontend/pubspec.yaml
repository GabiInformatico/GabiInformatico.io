name: osature_frontend
description: "Osature — adapta documentos a formatos de lectura accesible."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  intl: any

  # Gestión de estado (MVVM: la vista escucha a los ChangeNotifier).
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  fonts:
    # Titulares y elementos de interfaz.
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand/static/Quicksand-Medium.ttf
          weight: 500
        - asset: assets/fonts/Quicksand/static/Quicksand-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Quicksand/static/Quicksand-Bold.ttf
          weight: 700
    # Texto corrido.
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik/static/Rubik-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rubik/static/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik/static/Rubik-SemiBold.ttf
          weight: 600
